<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MISSION SCHEDULE</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="SCHEDULE">
    
    <style>
        /* =========================================
           GLOBAL THEME: DEEP SPACE (SHARED)
           ========================================= */
        body {
            font-family: "Helvetica Neue", "Segoe UI", Arial, sans-serif;
            background-color: #020204;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 1px, transparent 1.5px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 1.5px),
                radial-gradient(white, rgba(255,255,255,.1) 1.5px, transparent 2px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            color: #e6e6e6;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 40px;
            overscroll-behavior-x: none;
        }
        .container {
            max-width: 600px; /* 少し狭めてスマホ最適化 */
            margin: 0 auto;
            background: rgba(20, 20, 30, 0.4);
            padding: 20px;
            min-height: 100vh;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        /* --- HEADER --- */
        .app-header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }
        h1 {
            color: #ffffff;
            font-weight: 300;
            font-size: 1.4rem;
            letter-spacing: 3px;
            margin: 0;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
        }
        .back-link {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            color: #00ffff;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            padding: 10px;
        }
        .back-link::before {
            content: '◀';
            margin-right: 5px;
        }

        /* --- WEATHER STYLES --- */
        .weather-container {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding-bottom: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .weather-container::-webkit-scrollbar { display: none; }
        .weather-card {
            min-width: 80px;
            background: rgba(20, 30, 40, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .weather-date { font-size: 0.7rem; color: #888; margin-bottom: 5px; letter-spacing: 1px; }
        .weather-icon { font-size: 1.5rem; margin-bottom: 5px; }
        .weather-temp { font-size: 0.8rem; color: #fff; }
        .weather-rain { font-size: 0.7rem; color: #81d4fa; margin-top: 2px; }
        .weather-card.today { border-color: #00ffff; background: rgba(0, 255, 255, 0.05); }

        /* --- SCHEDULE STYLES --- */
        .section-title { 
            font-size: 1.1rem; color: #fff; font-weight: 300; 
            letter-spacing: 2px; margin-bottom: 20px; 
            border-left: 3px solid #00ffff; padding-left: 15px; 
        }
        .month-tabs-area {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .month-tab {
            background: rgba(255,255,255,0.1);
            color: #888;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
        }
        .month-tab.active {
            background: #00ffff;
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,255,255,0.3);
        }

        .schedule-list { list-style: none; padding: 0; margin: 0; }
        .schedule-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }
        .schedule-item:hover { background: rgba(255,255,255,0.05); }
        .schedule-item.top-attendance {
            background: linear-gradient(90deg, rgba(0,255,255,0.1), transparent);
            border-left: 3px solid #00ffff;
        }
        .schedule-date {
            font-size: 1.1rem; color: #fff; letter-spacing: 1px; display: flex; align-items: center;
        }
        .schedule-counts {
            display: flex; gap: 15px; font-size: 1rem; color: #ccc; align-items: center;
        }
        .count-ok { color: #fff; font-weight: bold; }
        .count-maybe { color: #aaa; }
        .count-ng { color: #666; }
        .count-symbol { margin-right: 2px; font-size: 0.9rem; }
        .crown-icon {
            color: #ffd700; font-size: 1.2rem; margin-right: 8px;
            filter: drop-shadow(0 0 5px rgba(255,215,0,0.6));
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        /* --- BUTTON STYLE (NEW) --- */
        .btn-link-area {
            text-align: center;
            margin: 20px 0 35px 0;
        }
        .btn-link {
            display: inline-block;
            background: linear-gradient(135deg, #00ffff 0%, #008b8b 100%);
            color: #000;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            transition: 0.3s;
            width: 80%;
            max-width: 300px;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .btn-link:hover {
            background: #fff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            transform: translateY(-2px);
        }
        .btn-link:active {
            transform: scale(0.98);
        }

        /* --- MODAL STYLES --- */
        #scheduleDetailModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 2000;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: rgba(15, 20, 30, 0.95);
            border: 1px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            width: 90%; max-width: 400px;
            max-height: 80vh; overflow-y: auto;
            padding: 30px; position: relative;
        }
        .close-btn {
            position: absolute; top: 15px; right: 15px;
            color: #fff; background: none; border: none;
            font-size: 1.5rem; cursor: pointer;
        }
        .detail-header {
            text-align: center; margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;
        }
        .detail-date { font-size: 1.4rem; color: #fff; letter-spacing: 2px; }
        .detail-list { list-style: none; padding: 0; margin: 0; }
        .member-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 5px; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .member-info { display: flex; align-items: center; gap: 12px; }
        .member-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: #333; color: #fff;
            display: flex; justify-content: center; align-items: center;
            font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.2);
        }
        .member-name { font-size: 1rem; color: #fff; }
        .member-status { font-size: 1.2rem; }
        .status-ok { color: #00ffff; text-shadow: 0 0 5px rgba(0,255,255,0.5); }
        .status-maybe { color: #fff; }
        .status-ng { color: #555; }

        /* --- LOADING --- */
        #loadingScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #020204; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s ease;
        }
        .loader-text {
            font-family: 'Courier New', monospace; color: #00ffff;
            font-size: 1.2rem; letter-spacing: 4px; margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .spinning { animation: spin 1s infinite linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loadingScreen">
    <div class="loader-text">ACCESSING ARCHIVE...</div>
</div>

<div class="container">
    <header class="app-header">
        <a href="./index.html" class="back-link">MAIN SYSTEM</a>
        <h1>MISSION SCHEDULE</h1>
    </header>

    <div class="section-title">天気予報</div>
    <div id="weather-forecast" class="weather-container">
        <div class="weather-card"><div class="spinning">❖</div></div>
    </div>

    <div class="section-title" style="margin-top: 30px;">日程候補日</div>
    
    <!-- Button Style Link -->
    <div class="btn-link-area">
        <a href="https://liff.line.me/2008858372-NgwrDQlQ" target="_blank" class="btn-link">
            日程調整記入はこちらから ↗
        </a>
    </div>

    <div id="scheduleTabs" class="month-tabs-area"></div>
    <div id="scheduleList" class="schedule-list">
        <div style="padding:20px; text-align:center; color:#888;">LOADING DATA...</div>
    </div>
</div>

<!-- Modal -->
<div id="scheduleDetailModal" onclick="closeScheduleModal(event)">
    <div class="modal-content">
        <button class="close-btn" onclick="closeScheduleModal(event)">×</button>
        <div class="detail-header">
            <div class="detail-date" id="modalScheduleDate"></div>
            <div style="font-size:0.8rem; color:#888;">回答状況</div>
        </div>
        <ul class="detail-list" id="modalScheduleList"></ul>
    </div>
</div>

<script>
    // --- CONSTANTS ---
    const SCHEDULE_GAS_URL = "https://script.google.com/macros/s/AKfycbxkywDklSyaMf93hYhG-ULAyAEQ1qHGgaYjNewTxX34pfySOZKYsbwehygCccEvnchB/exec";
    let globalScheduleData = [];

    // --- INITIALIZATION ---
    window.onload = function() {
        fetchWeather();
        fetchScheduleData();
        
        // Loading animation fade out
        setTimeout(() => {
            const ls = document.getElementById('loadingScreen');
            if(ls) {
                ls.style.opacity = 0;
                setTimeout(() => { ls.style.display = 'none'; }, 800);
            }
        }, 800);
    };

    // --- WEATHER LOGIC ---
    function fetchWeather() {
        // Tokyo Coordinates
        const url = "https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo";
        
        fetch(url)
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('weather-forecast');
            container.innerHTML = "";
            const daily = data.daily;
            
            for(let i=0; i<daily.time.length; i++) {
                const dateStr = daily.time[i].slice(5).replace('-', '/');
                const maxT = Math.round(daily.temperature_2m_max[i]);
                const minT = Math.round(daily.temperature_2m_min[i]);
                const rain = daily.precipitation_probability_max[i];
                const code = daily.weathercode[i];
                const icon = weatherCodeToIcon(code);
                
                const isToday = i === 0 ? 'today' : '';

                const div = document.createElement('div');
                div.className = `weather-card ${isToday}`;
                div.innerHTML = `
                    <div class="weather-date">${dateStr}</div>
                    <div class="weather-icon">${icon}</div>
                    <div class="weather-temp">${maxT}° / ${minT}°</div>
                    <div class="weather-rain">☂ ${rain}%</div>
                `;
                container.appendChild(div);
            }
        })
        .catch(err => {
            console.error("Weather Error", err);
            document.getElementById('weather-forecast').innerHTML = '<div style="color:#666; font-size:0.8rem; padding:10px;">WEATHER SIGNAL LOST</div>';
        });
    }

    function weatherCodeToIcon(code) {
        if (code === 0) return "☀";
        if (code === 1 || code === 2 || code === 3) return "☁";
        if (code === 45 || code === 48) return "🌫";
        if (code >= 51 && code <= 67) return "☂";
        if (code >= 71 && code <= 77) return "☃";
        if (code >= 80 && code <= 82) return "☂";
        if (code >= 85 && code <= 86) return "☃";
        if (code >= 95) return "⚡";
        return "❓";
    }

    // --- SCHEDULE LOGIC ---
    function fetchScheduleData() {
        const list = document.getElementById('scheduleList');
        fetch(SCHEDULE_GAS_URL)
          .then(response => response.json())
          .then(data => {
            globalScheduleData = data;
            if(data.length === 0) {
                list.innerHTML = '<div style="padding:20px;text-align:center;color:#888;">予定がありません</div>';
                return;
            }
            initScheduleTabs(data);
          })
          .catch(error => {
            console.error(error);
            list.innerHTML = '<div style="padding:20px;text-align:center;color:#888;">CONNECTION ERROR</div>';
          });
    }

    function initScheduleTabs(data) {
        const tabsContainer = document.getElementById('scheduleTabs');
        tabsContainer.innerHTML = "";
        
        const months = [...new Set(data.map(item => item.fullDate.substring(0, 7)))];
        
        months.forEach((m, idx) => {
            const btn = document.createElement('div');
            btn.className = 'month-tab';
            const mNum = parseInt(m.split('-')[1]);
            btn.textContent = `${mNum}月`;
            btn.onclick = () => {
                document.querySelectorAll('.month-tab').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                renderScheduleList(m);
            };
            if(idx === 0) {
                btn.classList.add('active');
                renderScheduleList(m);
            }
            tabsContainer.appendChild(btn);
        });
    }

    function renderScheduleList(targetMonth) {
        const list = document.getElementById('scheduleList');
        list.innerHTML = "";
        
        const filtered = globalScheduleData.filter(item => item.fullDate.startsWith(targetMonth));
        
        let maxOk = 0;
        filtered.forEach(item => {
            if(item.counts.ok > maxOk) maxOk = item.counts.ok;
        });

        filtered.forEach((item) => {
            const li = document.createElement('li');
            li.className = 'schedule-item';
            
            let crownHtml = "";
            if (maxOk > 0 && item.counts.ok === maxOk) {
                li.classList.add('top-attendance');
                crownHtml = '<span class="crown-icon">👑</span>';
            }

            li.onclick = () => showScheduleDetail(item);
            
            li.innerHTML = `
                <div class="schedule-date">${crownHtml}${item.date}</div>
                <div class="schedule-counts">
                    <span class="count-ok"><span class="count-symbol">◯</span>${item.counts.ok}</span>
                    <span class="count-maybe"><span class="count-symbol">△</span>${item.counts.maybe}</span>
                    <span class="count-ng"><span class="count-symbol">✕</span>${item.counts.ng}</span>
                </div>
            `;
            list.appendChild(li);
        });
    }

    function showScheduleDetail(itemData) {
        document.getElementById('modalScheduleDate').innerText = itemData.date;
        const list = document.getElementById('modalScheduleList');
        list.innerHTML = "";
        
        if (!itemData.details || itemData.details.length === 0) {
            list.innerHTML = '<li style="padding:20px; text-align:center; color:#888;">回答データなし</li>';
        } else {
            const sortedDetails = itemData.details.sort((a, b) => {
                const rank = { "ok": 1, "maybe": 2, "ng": 3 };
                return rank[a.status] - rank[b.status];
            });

            sortedDetails.forEach(member => {
                const li = document.createElement('li');
                li.className = 'member-item';
                
                const initial = member.name.charAt(0);
                let statusIcon = '';
                if(member.status === 'ok') statusIcon = '<span class="status-ok">◯</span>';
                else if(member.status === 'maybe') statusIcon = '<span class="status-maybe">△</span>';
                else statusIcon = '<span class="status-ng">✕</span>';

                // LocalStorage Avatar check
                const storedAvatar = localStorage.getItem(`avatar_${member.name}`);
                let avatarStyle = '';
                let avatarContent = initial;
                
                if(storedAvatar) {
                    avatarStyle = `background-image: url(${storedAvatar}); background-size: cover; background-position: center; color: transparent; border: 1px solid #00ffff;`;
                    avatarContent = '';
                }

                li.innerHTML = `
                    <div class="member-info">
                        <div class="member-avatar" style="${avatarStyle}">${avatarContent}</div>
                        <div class="member-name">${member.name}</div>
                    </div>
                    <div class="member-status">${statusIcon}</div>
                `;
                list.appendChild(li);
            });
        }
        document.getElementById('scheduleDetailModal').style.display = 'flex';
    }

    function closeScheduleModal(e) {
        if(e.target.id === 'scheduleDetailModal' || e.target.className === 'close-btn') {
            document.getElementById('scheduleDetailModal').style.display = 'none';
        }
    }
</script>
</body>
</html>
