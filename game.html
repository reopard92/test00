<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME ARCHIVE | CODE NAME: 108</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="GAME 108">
    <link rel="apple-touch-icon" href="./icon.png">
    <style>
        /* =========================================
           GLOBAL THEME: DEEP SPACE (SHARED)
           ========================================= */
        body {
            font-family: "Helvetica Neue", "Segoe UI", Arial, sans-serif;
            background-color: #020204;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 1px, transparent 1.5px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 1.5px);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
            color: #e6e6e6;
            margin: 0;
            padding-bottom: 40px;
            min-height: 100vh;
            overscroll-behavior-x: none;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(20, 20, 30, 0.4);
            padding: 20px;
            min-height: 100vh;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        /* --- HEADER --- */
        .app-header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }
        h1 {
            color: #fff;
            font-weight: 300;
            font-size: 1.4rem;
            letter-spacing: 3px;
            margin: 0;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
        }
        .back-link {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #00ffff;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 10px;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .back-link:hover {
            text-shadow: 0 0 10px #00ffff;
        }
        .menu-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #00ffff;
            font-size: 1.5rem;
            cursor: pointer;
            background: none;
            border: none;
            padding: 10px;
        }

        /* --- SIDE MENU --- */
        .side-menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 6000;
            visibility: hidden;
            opacity: 0;
            display: flex;
            justify-content: flex-end;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .side-menu-overlay.open {
            visibility: visible;
            opacity: 1;
        }
        .side-menu-content {
            width: 80%;
            max-width: 300px;
            height: 100%;
            background: rgba(10, 15, 20, 0.95);
            border-left: 1px solid rgba(0,255,255,0.3);
            padding-top: 90px;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .side-menu-overlay.open .side-menu-content {
            transform: translateX(0);
        }
        .menu-item {
            padding: 20px 30px;
            color: #fff;
            font-size: 1.1rem;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .menu-item:hover {
            background: rgba(0,255,255,0.1);
            color: #00ffff;
            padding-left: 40px;
        }
        .menu-item.active {
            color: #00ffff;
            border-left: 4px solid #00ffff;
            background: rgba(0,255,255,0.05);
        }

        /* --- GAME GRID --- */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            padding: 10px;
        }
        .game-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .game-card:hover {
            background: rgba(255,255,255,0.1);
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0,255,255,0.3);
            transform: translateY(-5px);
        }
        .game-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
        }
        .game-card-title {
            font-size: 0.8rem;
            font-weight: bold;
            color: #fff;
            letter-spacing: 1px;
        }

        /* --- MODALS --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

        .modal-content {
            background: rgba(15, 20, 30, 0.95);
            border: 1px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            width: 90%;
            max-width: 350px;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            border-radius: 4px;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
            z-index: 100;
            opacity: 0.8;
            transition: 0.3s;
        }
        .close-btn:hover {
            color: #00ffff;
            opacity: 1;
        }

        /* --- SLOT STYLES --- */
        .slot-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            perspective: 1000px;
        }
        .slot-reel {
            width: 60px;
            height: 80px;
            background: #111;
            border: 2px solid #00ffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .slot-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #ff9800, #ff5722);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(255,87,34,0.4);
            transition: 0.2s;
        }
        .slot-btn:active { transform: scale(0.95); }
        .slot-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

        /* --- SHOP HOLOGRAM --- */
        .holo-showcase {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .holo-item {
            width: 180px;
            height: 180px;
            margin: 0 auto;
            position: relative;
            animation: float 4s ease-in-out infinite;
            margin-bottom: 20px;
        }
        @keyframes float { 
            0%,100% { transform: translateY(0); } 
            50% { transform: translateY(-10px); } 
        }
        .holo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(0,255,255,0.6);
            box-shadow: 0 0 25px rgba(0,255,255,0.4);
        }
        .hold-btn {
            position: relative;
            background: transparent;
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 12px 40px;
            cursor: pointer;
            overflow: hidden;
            font-weight: bold;
            letter-spacing: 2px;
            transition: 0.3s;
            user-select: none;
            -webkit-user-select: none;
        }
        .hold-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: rgba(0,255,255,0.3);
            transition: width 0s;
        }
        .hold-btn.holding .hold-progress {
            width: 100%;
            transition: width 1.5s linear;
        }
        .hold-btn:active { transform: scale(0.98); }

        /* --- COIN TOSS --- */
        .coin-large {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, #fff, #b0bec5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            margin: 0 auto 20px;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
        .coin-large.spinning {
            animation: spin 0.5s infinite ease-in-out;
        }
        @keyframes spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        #toast {
            visibility: hidden;
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 12px 24px;
            border: 1px solid #00ffff;
            border-radius: 4px;
            z-index: 3000;
            font-size: 0.9rem;
            letter-spacing: 1px;
            opacity: 0;
            transition: 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 70px;
        }
    </style>
</head>
<body>

<div id="sideMenu" class="side-menu-overlay" onclick="closeSideMenu(event)">
    <div class="side-menu-content">
        <!-- 連携のため相対パスで index.html へ戻る -->
        <div class="menu-item" onclick="location.href='./index.html'">🎾 TENNIS</div>
        <div class="menu-item active">🎮 GAME</div>
        <!-- マイページも index.html 内の機能とする想定 -->
        <div class="menu-item" onclick="location.href='./index.html'">👤 MY PAGE</div>
    </div>
</div>

<div class="container">
    <header class="app-header">
        <a href="./index.html" class="back-link">MAIN</a>
        <h1>GAME ARCHIVE</h1>
        <button class="menu-btn" onclick="toggleSideMenu()">≡</button>
    </header>

    <div class="game-grid">
        <!-- CARD BATTLE (外部サイト) -->
        <div class="game-card" onclick="window.location.href='https://reopard92.github.io/game/'">
            <div class="game-icon">⚔️</div>
            <div class="game-card-title">CARD BATTLE</div>
        </div>

        <div class="game-card" onclick="openCoinGame()">
            <div class="game-icon">🪙</div>
            <div class="game-card-title">COIN TOSS</div>
        </div>

        <div class="game-card" onclick="openSlotGame()">
            <div class="game-icon">🎰</div>
            <div class="game-card-title">CYBER SLOTS</div>
        </div>

        <div class="game-card" onclick="openShop()">
            <div class="game-icon">🛒</div>
            <div class="game-card-title">ITEM SHOP</div>
        </div>
    </div>
</div>

<!-- COIN MODAL -->
<div id="coinGameModal" class="modal-overlay" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal-content">
        <span class="close-btn" onclick="document.getElementById('coinGameModal').style.display='none'">×</span>
        <div style="margin-bottom:20px; color:#aaa; letter-spacing:2px;">COIN TOSS</div>
        <div id="gameCoin" class="coin-large" onclick="playCoinToss()">TAP</div>
        <div style="font-size:0.8rem; color:#666;">TAP TO FLIP</div>
    </div>
</div>

<!-- SLOT MODAL -->
<div id="slotGameModal" class="modal-overlay" onclick="if(event.target===this && !isSpinning)this.style.display='none'">
    <div class="modal-content">
        <span class="close-btn" onclick="if(!isSpinning)document.getElementById('slotGameModal').style.display='none'">×</span>
        <div style="color:#00ffff; margin-bottom:20px; letter-spacing:2px;">CYBER SLOTS</div>
        <div class="slot-container">
            <div id="reel1" class="slot-reel">?</div>
            <div id="reel2" class="slot-reel">?</div>
            <div id="reel3" class="slot-reel">?</div>
        </div>
        <div id="slotMsg" style="margin:20px 0; color:#aaa; min-height:1.2em;">BET 100 COINS</div>
        <button id="spinBtn" class="slot-btn" onclick="spinSlot()">SPIN</button>
        <div style="margin-top:20px; font-size:0.7rem; color:#666; line-height:1.5;">
            777: 7777 | 💎: 1000 | 🔔: 500 | 🍒: 300
        </div>
    </div>
</div>

<!-- SHOP MODAL -->
<div id="shopModal" class="modal-overlay" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal-content">
        <span class="close-btn" onclick="document.getElementById('shopModal').style.display='none'">×</span>
        <div style="margin-bottom:10px; letter-spacing:2px;">ITEM SHOP</div>
        <div class="holo-showcase">
            <div class="holo-item">
                <!-- ユーザー提供の画像ファイル名を参照、エラー時はプレイスホルダー -->
                <img src="./今田美桜.png" onerror="this.src='https://placehold.co/180x180/000/00ffff?text=CARD'" alt="ITEM" class="holo-img">
            </div>
            <div style="margin:10px 0; font-size:1.1rem; font-weight:bold;">LIMITED CARD<br><span style="color:#ffd700; font-size:0.9rem;">10,000 COINS</span></div>
            <button class="hold-btn" onmousedown="startHold(this, event)" ontouchstart="startHold(this, event)" onmouseup="endHold(this)" ontouchend="endHold(this)" onmouseleave="endHold(this)">
                <div class="hold-progress"></div>
                <span style="position:relative; z-index:2;">HOLD TO BUY</span>
            </button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    // --- SHARED CONFIG ---
    // コイン管理用のGAS（新規追加機能用）
    const COIN_MANAGER_URL = "https://script.google.com/macros/s/AKfycbyMTW3WIJmSDQUmGq6GDVAz0AkKIaghNcFf5mEsfS4skWJM2YTTh65Pt85vVnJqwklq/exec";
    // CODE NAME: 48 (index.html) と共通の認証キー
    const LOGIN_KEY = 'tennis_user_auth';
    
    let currentUser = null;
    let globalCoinBalances = {};
    let playerStatsGlobal = {};

    window.onload = function() {
        initAuth();
        fetchCoinData();
        fetchAnalysisData(); // テニス活動実績に基づくベースコイン計算のため
    };

    function initAuth() {
        const u = localStorage.getItem(LOGIN_KEY);
        if(u) {
            currentUser = JSON.parse(u);
            console.log("Logged in as:", currentUser.name);
        }
    }
    
    // --- COIN LOGIC ---
    async function fetchCoinData() {
        try {
            const res = await fetch(COIN_MANAGER_URL);
            globalCoinBalances = await res.json();
        } catch(e) { console.error("Coin Data Error", e); }
    }
    
    // CODE NAME: 48 と同じデータソースから実績を取得
    async function fetchAnalysisData() {
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzoybbIaxOq4EtWaBkvdPNzkN1_7lmFRnAQLbnu6A40YUQdbzX6gTfIY5CznZs13GYxZw/exec";
        try {
            const res = await fetch(GAS_URL);
            const json = await res.json();
            const stats = {};
            // ランキングデータから勝利数等を抽出してコイン基礎値に使用
            if(json.rankings && json.rankings.length > 1) {
                json.rankings.slice(1).forEach(r => {
                    if(r[3]) {
                        const n = r[3].split(' (')[0];
                        if(!stats[n]) stats[n] = 0;
                        stats[n] += parseInt(r[7]||0); // 総ゲーム数をベースに加算
                    }
                });
            }
            playerStatsGlobal = stats;
        } catch(e) { console.error("Analysis Data Error", e); }
    }

    function getUserCoins(name) {
        if (!name) return 0;
        // 実績ベース(ゲーム数*100) + 変動分(スロット等)
        const base = (playerStatsGlobal[name] || 0) * 100;
        const variable = globalCoinBalances[name] || 0;
        return Math.max(0, base + variable);
    }
    
    function sendCoinTransaction(name, amount, reason) {
        if(!globalCoinBalances[name]) globalCoinBalances[name]=0;
        globalCoinBalances[name] += amount;
        
        // UI即時反映用（もし表示箇所があれば）
        
        // バックグラウンド送信
        fetch(COIN_MANAGER_URL, {
            method: 'POST', mode: 'no-cors',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: name, amount: amount, reason: reason})
        });
    }

    // --- MENU CONTROL ---
    window.toggleSideMenu = function() { document.getElementById('sideMenu').classList.toggle('open'); }
    window.closeSideMenu = function(e) { if(e.target.id === 'sideMenu') document.getElementById('sideMenu').classList.remove('open'); }

    // --- GAME 1: COIN TOSS ---
    window.openCoinGame = function() { 
        document.getElementById('coinGameModal').style.display='flex'; 
        const c = document.getElementById('gameCoin');
        c.classList.remove('spinning'); 
        c.textContent="TAP"; 
    }
    window.playCoinToss = function() {
        const c = document.getElementById('gameCoin');
        if(c.classList.contains('spinning')) return;
        c.classList.add('spinning'); c.textContent="";
        setTimeout(() => { 
            c.classList.remove('spinning'); 
            c.textContent = Math.random() < 0.5 ? "HEAD" : "TAIL"; 
        }, 1000);
    }

    // --- GAME 2: CYBER SLOTS ---
    const slotSymbols = ['🍒', '🔔', '💎', '7️⃣', '❌', '🌙'];
    let isSpinning = false;
    
    window.openSlotGame = function() { document.getElementById('slotGameModal').style.display='flex'; }
    
    window.spinSlot = function() {
        if(isSpinning) return;
        if(!currentUser) return showToast("LOGIN REQUIRED");
        
        const currentCoins = getUserCoins(currentUser.name);
        if(currentCoins < 100) return showToast(`NO COINS (REQ: 100 / HAVE: ${currentCoins})`);

        // 消費
        sendCoinTransaction(currentUser.name, -100, "Slot Spin");
        
        isSpinning = true;
        document.getElementById('spinBtn').disabled = true;
        document.getElementById('slotMsg').textContent = "SPINNING...";
        
        const reels = ['reel1', 'reel2', 'reel3'];
        const results = [];
        
        reels.forEach((id, i) => {
            const el = document.getElementById(id);
            // 回転演出
            const interval = setInterval(() => { 
                el.textContent = slotSymbols[Math.floor(Math.random()*slotSymbols.length)]; 
            }, 80);
            
            // 停止
            setTimeout(() => {
                clearInterval(interval);
                // 確率操作（少し当たりやすく調整する場合はここでロジック変更）
                const sym = slotSymbols[Math.floor(Math.random()*slotSymbols.length)];
                el.textContent = sym;
                results.push(sym);
                
                if(i===2) finishSlot(results);
            }, 1000 + i*500);
        });
    }

    function finishSlot(res) {
        isSpinning = false;
        document.getElementById('spinBtn').disabled = false;
        
        let r=0, m="NO LUCK";
        
        if(res[0]==='7️⃣'&&res[1]==='7️⃣'&&res[2]==='7️⃣'){ r=7777; m="JACKPOT!!"; }
        else if(res[0]==='💎'&&res[1]==='💎'&&res[2]==='💎'){ r=1000; m="BIG WIN!"; }
        else if(res[0]==='🔔'&&res[1]==='🔔'&&res[2]==='🔔'){ r=500; m="NICE!"; }
        else if(res[0]==='🍒'&&res[1]==='🍒'&&res[2]==='🍒'){ r=300; m="GOOD!"; }
        else if(res.includes('7️⃣')){ r=50; m="REPLAY"; } // セブンが1つでもあれば小当たり
        
        document.getElementById('slotMsg').textContent = m + (r>0 ? ` +${r} COINS` : "");
        
        if(r>0) {
            sendCoinTransaction(currentUser.name, r, "Slot Win");
            showToast(m + ` (+${r})`);
        }
    }

    // --- GAME 3: ITEM SHOP ---
    let holdTimer = null;
    window.openShop = function() { document.getElementById('shopModal').style.display='flex'; }
    
    window.startHold = function(btn, e) {
        // タッチイベント等のデフォルト動作防止
        if(e && e.type === 'touchstart') e.preventDefault();
        
        btn.classList.add('holding');
        holdTimer = setTimeout(() => buyItem(), 1500); // 1.5秒長押しで購入
    }
    
    window.endHold = function(btn) { 
        clearTimeout(holdTimer); 
        btn.classList.remove('holding'); 
    }
    
    function buyItem() {
        const btn = document.querySelector('.hold-btn');
        btn.classList.remove('holding');
        
        if(!currentUser) return showToast("LOGIN REQUIRED");
        const currentCoins = getUserCoins(currentUser.name);
        
        if(currentCoins < 10000) return showToast(`NOT ENOUGH COINS (${currentCoins})`);
        
        // 重複購入チェック（ローカルストレージ簡易チェック）
        if(localStorage.getItem(`has_imada_card_${currentUser.name}`)) {
            return showToast("ALREADY OWNED");
        }

        sendCoinTransaction(currentUser.name, -10000, "Buy Card: Imada");
        localStorage.setItem(`has_imada_card_${currentUser.name}`, 'true');
        showToast("PURCHASE SUCCESSFUL!");
        
        setTimeout(() => {
            document.getElementById('shopModal').style.display='none';
        }, 1000);
    }

    function showToast(m) {
        const t = document.getElementById('toast');
        t.textContent = m;
        t.className = 'show';
        setTimeout(() => t.className = '', 3000);
    }
</script>
</body>
</html>
